<!doctype html>
<!-- data-theme drives ng-diagram's built-in dark palette; the site itself is dark-only. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--
    These tags are static HTML, so they cannot read community.config.ts.
    Replace every "Angular Community" / "your-community.example" below when you fork.
  -->
  <title>Angular Community: Empowering Angular Developers</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="description" content="A community of Angular developers learning in the open, contributing to open source, and meeting regularly.">
  <meta name="keywords" content="Angular, Angular community, Angular developers, Angular meetups, open source">
  <meta name="author" content="Angular Community">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Angular Community: Empowering Angular Developers">
  <meta property="og:description" content="Join our Angular developer community. Meetups, open source, and more.">
  <meta property="og:url" content="https://your-community.example">
  <meta property="og:image" content="https://your-community.example/brand/logo.svg">
  <meta property="og:site_name" content="Angular Community">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Angular Community: Empowering Angular Developers">
  <meta name="twitter:description" content="Join our Angular developer community.">
  <meta name="twitter:image" content="https://your-community.example/brand/logo.svg">

  <link rel="canonical" href="https://your-community.example">
  <link rel="icon" type="image/svg+xml" href="brand/logo.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#DD0031">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Angular Community",
    "url": "https://your-community.example",
    "logo": "https://your-community.example/brand/logo.svg",
    "description": "A community of Angular developers learning in the open.",
    "sameAs": [
      "https://github.com/your-org"
    ]
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
